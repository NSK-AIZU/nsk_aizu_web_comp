<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | NPO NSK_AIZU</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="home login-body">
    <header class="header" id="common-header"></header>

    <main class="login-main" id="main-content" role="main">
        <div class="login-container">
            <div class="login-card">
                <div class="login-card__header">
                    <h1 class="login-card__title">MEMBERS</h1>
                    <p class="login-card__subtitle" id="js-login-subtitle">メンバー専用ページ</p>
                </div>

                <form id="js-login-form" class="login-form">
                    <div class="login-form__group">
                        <label for="login-email" class="login-form__label">メールアドレス</label>
                        <input
                            id="login-email"
                            type="email"
                            required
                            placeholder="you@example.com"
                            class="login-form__input"
                            autocomplete="email"
                        >
                    </div>
                    <div class="login-form__group">
                        <label for="login-password" class="login-form__label">パスワード</label>
                        <input
                            id="login-password"
                            type="password"
                            required
                            minlength="6"
                            placeholder="6文字以上"
                            class="login-form__input"
                            autocomplete="current-password"
                        >
                    </div>
                    <button type="submit" class="login-form__submit" id="js-login-btn">
                        ログイン
                    </button>
                </form>

                <div id="js-login-message" class="login-message" style="display:none;"></div>

                <div class="login-card__footer">
                    <button type="button" id="js-toggle-mode" class="login-card__toggle">
                        新規登録はこちら
                    </button>
                </div>
            </div>

            <a href="/" class="login-back">&larr; トップページに戻る</a>
        </div>
    </main>

    <footer class="footer" id="common-footer"></footer>
    <script src="common.js"></script>

    <script>
    (function() {
        // Supabase 設定
        const SUPABASE_URL = 'https://wiwumonqzyxhkgwmtdte.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpd3Vtb25xenl4aGtnd210ZHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNDYxNzEsImV4cCI6MjA4ODYyMjE3MX0.AifBX8wVFVcqL8ANfatcGkcuGd1Yfopn_o_O95-T1MY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 既にログイン済みならメンバーページへ
        supabase.auth.getUser().then(({ data: { user } }) => {
            if (user) {
                window.location.href = '/members/';
            }
        });

        const form = document.getElementById('js-login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const submitBtn = document.getElementById('js-login-btn');
        const messageEl = document.getElementById('js-login-message');
        const toggleBtn = document.getElementById('js-toggle-mode');
        const subtitleEl = document.getElementById('js-login-subtitle');

        let isSignUp = false;

        function showMessage(text, isError) {
            messageEl.textContent = text;
            messageEl.className = 'login-message ' + (isError ? 'login-message--error' : 'login-message--success');
            messageEl.style.display = 'block';
        }

        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            subtitleEl.textContent = isSignUp ? '新規アカウント登録' : 'メンバー専用ページ';
            submitBtn.textContent = isSignUp ? 'アカウントを作成' : 'ログイン';
            toggleBtn.textContent = isSignUp ? 'すでにアカウントをお持ちの方はこちら' : '新規登録はこちら';
            messageEl.style.display = 'none';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = '処理中...';
            messageEl.style.display = 'none';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                if (isSignUp) {
                    // 許可リストをチェック
                    const { data: allowed, error: checkErr } = await supabase
                        .from('allowed_emails')
                        .select('email')
                        .eq('email', email)
                        .maybeSingle();

                    if (checkErr) {
                        showMessage('登録確認中にエラーが発生しました', true);
                        return;
                    }
                    if (!allowed) {
                        showMessage('このメールアドレスは登録が許可されていません。管理者にお問い合わせください。', true);
                        return;
                    }

                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) {
                        showMessage('エラー: ' + error.message, true);
                        return;
                    }
                    // 直接ログイン試行
                    const { error: loginError } = await supabase.auth.signInWithPassword({ email, password });
                    if (!loginError) {
                        window.location.href = '/members/';
                        return;
                    }
                    showMessage('登録完了しました。ログインしてください。', false);
                    isSignUp = false;
                    subtitleEl.textContent = 'メンバー専用ページ';
                    toggleBtn.textContent = '新規登録はこちら';
                } else {
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        showMessage('エラー: ' + error.message, true);
                        return;
                    }
                    window.location.href = '/members/';
                }
            } catch (err) {
                showMessage('通信エラーが発生しました', true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUp ? 'アカウントを作成' : 'ログイン';
            }
        });
    })();
    </script>
</body>
</html>
