<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンバーダッシュボード | NSK_AIZU</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/style.css?v=8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="members-body">
    <header class="m-header" id="members-header"></header>

    <main class="m-main" id="main-content">
        <div id="js-loading" class="m-loading">
            <div class="m-loading__spinner"></div>
            <p>読み込み中...</p>
        </div>

        <div id="js-content" style="display:none;">
            <div class="m-dash">
                <h1 class="m-dash__title">DASHBOARD</h1>
                <p class="m-dash__subtitle">ようこそ、<span id="js-user-name"></span>さん</p>
            </div>

            <div class="m-dash__grid" id="js-app-grid">
                <!-- 名刺管理 -->
                <a href="/members/meishi/" class="m-dash__card">
                    <div class="m-dash__card-icon">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                            <rect x="4" y="8" width="32" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
                            <circle cx="16" cy="18" r="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M8 28c0-2.2 3.6-4 8-4s8 1.8 8 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M26 14h6M26 18h6M26 22h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2 class="m-dash__card-title">名刺管理</h2>
                    <p class="m-dash__card-app">Who_Are_You?</p>
                    <p class="m-dash__card-desc">名刺をデジタル管理。OCR読取・検索・タグ分類</p>
                </a>

                <!-- Coming Soon 1 -->
                <div class="m-dash__card m-dash__card--soon">
                    <div class="m-dash__card-icon">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                            <rect x="6" y="4" width="28" height="32" rx="3" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 12h16M12 18h16M12 24h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h2 class="m-dash__card-title">Coming Soon</h2>
                    <p class="m-dash__card-desc">新しい機能を準備中です</p>
                </div>

                <!-- Coming Soon 2 -->
                <div class="m-dash__card m-dash__card--soon">
                    <div class="m-dash__card-icon">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                            <circle cx="20" cy="20" r="14" stroke="currentColor" stroke-width="2"/>
                            <path d="M20 12v8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h2 class="m-dash__card-title">Coming Soon</h2>
                    <p class="m-dash__card-desc">新しい機能を準備中です</p>
                </div>
            </div>

            <a href="/" class="m-dash__back">&larr; トップページ</a>
        </div>
    </main>

    <script src="members-common.js"></script>
    <script>
    (async function() {
        const user = await requireAuth();
        renderMembersHeader();

        // ユーザー名表示
        const nameEl = document.getElementById('js-user-name');
        const email = user.email || '';
        nameEl.textContent = email.split('@')[0];

        document.getElementById('js-loading').style.display = 'none';
        document.getElementById('js-content').style.display = 'block';
    })();
    </script>
</body>
</html>
