<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名刺一覧 | Who_Are_You? | NSK_AIZU</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/style.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="members-body">
    <header class="m-header" id="members-header"></header>

    <main class="m-main" id="main-content">
        <!-- ローディング -->
        <div id="js-loading" class="m-loading">
            <div class="m-loading__spinner"></div>
            <p>読み込み中...</p>
        </div>

        <!-- コンテンツ（認証後に表示） -->
        <div id="js-content" style="display:none;">
            <!-- 検索 + 件数 -->
            <div class="m-toolbar">
                <div class="m-search">
                    <svg class="m-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" id="js-search" class="m-search__input" placeholder="氏名・会社名で検索...">
                    <button type="button" id="js-search-clear" class="m-search__clear" style="display:none;">&times;</button>
                </div>
                <a href="/members/meishi/new.html" class="m-toolbar__add">+ 新規登録</a>
                <span class="m-toolbar__count" id="js-count">0 件</span>
            </div>

            <!-- タグフィルター -->
            <div class="m-tags" id="js-tags"></div>

            <!-- カードグリッド -->
            <div class="m-card-grid" id="js-card-grid"></div>
        </div>
    </main>

    <script src="../members-common.js"></script>
    <script>
    (async function() {
        // 認証チェック
        await requireAuth();
        renderMembersHeader();

        const loadingEl = document.getElementById('js-loading');
        const contentEl = document.getElementById('js-content');
        const searchInput = document.getElementById('js-search');
        const searchClear = document.getElementById('js-search-clear');
        const countEl = document.getElementById('js-count');
        const tagsEl = document.getElementById('js-tags');
        const gridEl = document.getElementById('js-card-grid');

        let allCards = [];
        let allTags = [];
        let cardTagsMap = new Map(); // card_id -> Tag[]
        let selectedTagId = null;
        let searchQuery = '';

        // データ取得
        const [cardsRes, tagsRes, cardTagsRes] = await Promise.all([
            sb.from('business_cards').select('*').order('updated_at', { ascending: false }),
            sb.from('tags').select('*').order('name'),
            sb.from('card_tags').select('card_id, tag_id'),
        ]);

        allCards = cardsRes.data || [];
        allTags = tagsRes.data || [];

        // タグマップ構築
        const tagById = new Map(allTags.map(t => [t.id, t]));
        if (cardTagsRes.data) {
            for (const ct of cardTagsRes.data) {
                const tag = tagById.get(ct.tag_id);
                if (tag) {
                    if (!cardTagsMap.has(ct.card_id)) cardTagsMap.set(ct.card_id, []);
                    cardTagsMap.get(ct.card_id).push(tag);
                }
            }
        }

        // 表示
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
        renderTags();
        renderCards();

        // 検索
        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value;
            searchClear.style.display = searchQuery ? 'block' : 'none';
            renderCards();
        });
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            searchClear.style.display = 'none';
            renderCards();
        });

        function renderTags() {
            if (allTags.length === 0) { tagsEl.style.display = 'none'; return; }

            let html = `<button type="button" class="m-tag-btn ${selectedTagId === null ? 'm-tag-btn--active' : ''}" data-tag="">すべて</button>`;
            allTags.forEach(tag => {
                const active = selectedTagId === tag.id;
                html += `<button type="button" class="m-tag-btn" data-tag="${tag.id}" style="background-color:${tag.color};opacity:${active ? 1 : 0.6};">${tag.name}</button>`;
            });
            tagsEl.innerHTML = html;

            tagsEl.querySelectorAll('.m-tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tagId = btn.dataset.tag;
                    selectedTagId = tagId ? (selectedTagId === tagId ? null : tagId) : null;
                    renderTags();
                    renderCards();
                });
            });
        }

        function renderCards() {
            let filtered = allCards;

            // タグフィルター
            if (selectedTagId) {
                filtered = filtered.filter(card => {
                    const tags = cardTagsMap.get(card.id) || [];
                    return tags.some(t => t.id === selectedTagId);
                });
            }

            // テキスト検索
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(card => {
                    const tags = cardTagsMap.get(card.id) || [];
                    return (
                        (card.last_name || '').toLowerCase().includes(q) ||
                        (card.first_name || '').toLowerCase().includes(q) ||
                        (card.last_name_kana || '').toLowerCase().includes(q) ||
                        (card.first_name_kana || '').toLowerCase().includes(q) ||
                        (card.company || '').toLowerCase().includes(q) ||
                        (card.department || '').toLowerCase().includes(q) ||
                        (card.position || '').toLowerCase().includes(q) ||
                        (card.email || '').toLowerCase().includes(q) ||
                        tags.some(t => t.name.toLowerCase().includes(q))
                    );
                });
            }

            countEl.textContent = filtered.length + ' 件';

            if (filtered.length === 0) {
                if (allCards.length === 0) {
                    gridEl.innerHTML = `
                        <div class="m-empty">
                            <p class="m-empty__title">まだ名刺がありません</p>
                            <a href="/members/meishi/new.html" class="m-empty__link">最初の名刺を登録しましょう</a>
                        </div>`;
                } else {
                    gridEl.innerHTML = '<div class="m-empty"><p>検索結果が見つかりません</p></div>';
                }
                return;
            }

            gridEl.innerHTML = filtered.map(card => {
                const tags = cardTagsMap.get(card.id) || [];
                const name = `${card.last_name || ''} ${card.first_name || ''}`;
                const kana = [card.last_name_kana, card.first_name_kana].filter(Boolean).join(' ');
                const tagsHtml = tags.map(t => `<span class="m-card__tag" style="background-color:${t.color};">${t.name}</span>`).join('');

                let headerHtml;
                if (card.card_image_front) {
                    headerHtml = `
                        <div class="m-card__img-wrap">
                            <img src="${card.card_image_front}" alt="${name}の名刺" class="m-card__img" loading="lazy">
                            <div class="m-card__img-overlay">
                                <h3 class="m-card__name">${name}</h3>
                                ${kana ? `<p class="m-card__kana">${kana}</p>` : ''}
                            </div>
                        </div>`;
                } else {
                    headerHtml = `
                        <div class="m-card__name-area">
                            <h3 class="m-card__name m-card__name--large">${name}</h3>
                            ${kana ? `<p class="m-card__kana">${kana}</p>` : ''}
                        </div>`;
                }

                return `
                    <div class="m-card" data-id="${card.id}">
                        <a href="/members/meishi/edit.html?id=${card.id}" class="m-card__link">
                            ${headerHtml}
                            <div class="m-card__body">
                                ${card.company ? `<p class="m-card__company">${card.company}</p>` : ''}
                                ${(card.department || card.position) ? `<p class="m-card__dept">${card.department || ''}${card.department && card.position ? ' / ' : ''}${card.position || ''}</p>` : ''}
                                ${card.email ? `<p class="m-card__info">${card.email}</p>` : ''}
                                ${card.phone ? `<p class="m-card__info">${card.phone}</p>` : ''}
                                ${tagsHtml ? `<div class="m-card__tags">${tagsHtml}</div>` : ''}
                            </div>
                        </a>
                        <div class="m-card__actions">
                            <a href="/members/meishi/edit.html?id=${card.id}" class="m-card__action">編集</a>
                            <button type="button" class="m-card__action m-card__action--delete" data-id="${card.id}" data-name="${name}">削除</button>
                        </div>
                    </div>`;
            }).join('');

            // 削除ボタン
            gridEl.querySelectorAll('.m-card__action--delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    const id = btn.dataset.id;
                    const name = btn.dataset.name;
                    if (!confirm(`「${name}」の名刺を削除しますか？`)) return;

                    const { error } = await sb.from('business_cards').delete().eq('id', id);
                    if (!error) {
                        allCards = allCards.filter(c => c.id !== id);
                        renderCards();
                    }
                });
            });
        }
    })();
    </script>
</body>
</html>
